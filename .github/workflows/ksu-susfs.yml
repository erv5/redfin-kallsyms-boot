name: KSU-Next + SUSFS (redfin)

# Builds a KernelSU-Next + SUSFS redfin kernel matching the latest LineageOS OTA, using
# crDroid's proven redbull integration (KSU-Next v1.1.1 + SUSFS v1.5.7). On success it
# publishes a ready-to-flash boot.img + AnyKernel3 zip as a Release, and always uploads
# the build log + any rejects as artifacts. Runs every Wednesday + on demand.

on:
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ksu-susfs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Build KSU-Next + SUSFS
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/build-ksu-susfs.sh

      - name: Upload build log + rejects (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksu-susfs-logs
          path: |
            artifacts/build.log
            artifacts/config.txt
            artifacts/kernelrelease.txt
            artifacts/rejects/**
          if-no-files-found: warn

      - name: Publish release (on success)
        if: env.BUILT == '1' && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LineageOS $OTA_DATE (redfin, KSU-Next + SUSFS)" \
            --notes "$(cat <<EOF
          Ready-to-flash KernelSU-Next + SUSFS boot image for LineageOS \`redfin\`, matching:
          - LineageOS OTA: \`$OTA_NAME\`
          - Kernel: \`$VER\` (same version string as stock, so your vendor modules still load)
          - KernelSU-Next v1.1.1 + SUSFS, via crDroid's redbull integration.

          ## Flashing
          1. Take the LineageOS update and reboot.
          2. Download \`boot-ksunext-susfs-$OTA_DATE.img\` (or the AnyKernel3 \`.zip\`) below.
          3. \`fastboot flash boot boot-ksunext-susfs-$OTA_DATE.img\` on both slots and reboot, or sideload the zip in LineageOS recovery.
          4. Install the KernelSU-Next Manager, grant root. Multi-user: manage grants from User 0; root in User 10/work profiles works (see README).

          Keep your original boot.img as a fallback.
          EOF
          )" \
            artifacts/boot-ksunext-susfs-*.img artifacts/boot-ksunext-susfs-*.zip
