name: KSU-Next + SUSFS (redfin)

# Builds KernelSU-Next + SUSFS redfin kernels matching the latest LineageOS OTA, using
# crDroid's proven redbull integration (KSU-Next v1.1.1 + SUSFS v1.5.5). Two variants:
#   full = SUS_MOUNT on  (max hiding)        -> release ksunext-susfs-<date>
#   safe = SUS_MOUNT off (lower boot risk)   -> release ksunext-susfs-safe-<date>
# Both give multi-user root. Publishes a boot.img + AnyKernel3 zip per variant and always
# uploads build log + rejects. Runs every Wednesday + on demand.

on:
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, safe]
        offset: [0, 1, 2]  # last 3 los-* releases (like the KALLSYMS build), so 09-28 etc. are covered
    concurrency:
      group: ksu-susfs-${{ matrix.variant }}-${{ matrix.offset }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Build KSU-Next + SUSFS (${{ matrix.variant }})
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VARIANT: ${{ matrix.variant }}
          BUILD_OFFSET: ${{ matrix.offset }}
        run: bash scripts/build-ksu-susfs.sh

      - name: Upload build log + rejects (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksu-susfs-logs-${{ matrix.variant }}-${{ matrix.offset }}
          path: |
            artifacts/build.log
            artifacts/config.txt
            artifacts/kernelrelease.txt
            artifacts/rejects/**
            artifacts/boot-ksunext-susfs*.img
            artifacts/boot-ksunext-susfs*.zip
          if-no-files-found: warn

      - name: Publish release (on success)
        if: env.BUILT == '1' && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # replace any existing release for this variant+OTA (idempotent; distinct tag per variant, no race)
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LineageOS $OTA_DATE (redfin, KSU-Next + SUSFS, $VARIANT)" \
            --notes "$(cat <<EOF
          Ready-to-flash KernelSU-Next + SUSFS boot image for LineageOS \`redfin\` (variant: **$VARIANT**), matching:
          - LineageOS OTA: \`$OTA_NAME\`
          - Kernel: \`$VER\` (same version string as stock, so your vendor modules still load)
          - KernelSU-Next v1.1.1 + SUSFS v1.5.5. Multi-user root works (grant from User 0).

          **full** = maximum hiding (SUS_MOUNT + mount/path/kstat/uname/cmdline hiding on).
          **safe** = same multi-user root, SUS_MOUNT off (lower first-boot risk). Use this if full bootloops.

          ## Flashing
          1. Take the LineageOS update and reboot.
          2. Download \`boot-ksunext-susfs${SUF}-$OTA_DATE.img\` (or the AnyKernel3 \`.zip\`) below.
          3. \`fastboot flash boot <img>\` on both slots and reboot, or sideload the zip in LineageOS recovery.
          4. Install the KernelSU-Next Manager, grant root. For User 10 / work-profile apps, grant from User 0.

          Keep a fallback boot (stock for this OTA, or your old APatch boot if it is for this OTA) to revert in one command.
          EOF
          )" \
            artifacts/boot-ksunext-susfs*.img artifacts/boot-ksunext-susfs*.zip
