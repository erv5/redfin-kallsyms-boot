name: KSU + KSU-Next + SUSFS (redfin) [experimental]

# Builds two variants of a KernelSU + SUSFS redfin kernel in parallel:
#   ksu      = official tiann/KernelSU (pinned pre-EOL tag v1.0.5) + simonpunk susfs 4.19
#   ksunext  = KernelSU-Next (legacy)  + ShirkNeko susfs 4.19 (fallback simonpunk)
#
# This is ITERATIVE. Non-GKI 4.19 needs 5 hand-inserted manual hooks that setup.sh does
# not add, and the SUSFS KSU-side patch rejects on some trees. So the first runs exist to
# collect every .rej and the build log as artifacts. A flashable zip is produced only when
# the build actually succeeds (after you commit patches/manual-hooks-redbull-4.19.patch and
# any reject fixes under patches/<variant>/). Manual trigger only, from the Actions tab.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ksu, ksunext]
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Build ${{ matrix.variant }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/build-ksu-susfs.sh

      - name: Upload rejects + build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-rejects-and-logs
          path: |
            artifacts/rejects-${{ matrix.variant }}/**
            artifacts/build-${{ matrix.variant }}.log
            artifacts/config-${{ matrix.variant }}.txt
            artifacts/kernelrelease-${{ matrix.variant }}.txt
          if-no-files-found: warn

      - name: Upload flashable outputs (only if the build succeeded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-flashable
          path: |
            artifacts/boot-${{ matrix.variant }}-susfs.zip
            artifacts/boot-${{ matrix.variant }}-susfs-*.img
          if-no-files-found: ignore
